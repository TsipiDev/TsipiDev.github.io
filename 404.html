<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found · Dimitris Vatousis</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#edf0f2">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --board: #edf0f2;
            --hole: #cfd4d8;
            --ink: #15171a;
            --ink-2: #3a3e44;
            --ink-3: #5c6168;
            --chip: #17191c;
            --chip-text: #f4f4f1;
            --chip-muted: #b9bdc3;
            --pin: #a9aca7;
            --red: #d7372b;
            --blue: #2457c5;
            --yellow: #f0b429;
            --pitch: 24px;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-seat: cubic-bezier(0.34, 1.4, 0.64, 1);
            --display: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif;
            --text: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { background: var(--board); -webkit-text-size-adjust: 100%; }

        body {
            min-height: 100vh; min-height: 100dvh;
            display: grid; grid-template-columns: minmax(0, 640px); justify-content: center; align-content: center;
            padding: calc(var(--pitch) * 6) clamp(34px, 6vw, 72px) calc(var(--pitch) * 3);
            font-family: var(--text); font-size: 17px; line-height: 1.6; color: var(--ink-2);
            background-color: var(--board);
            background-image: radial-gradient(circle at center, var(--hole) 0 2.2px, transparent 2.8px);
            background-size: var(--pitch) var(--pitch);
            background-position: calc(var(--pitch) / 2) calc(var(--pitch) / 2);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        ::selection { background: var(--yellow); color: var(--ink); }
        :focus-visible { outline: 2px dashed var(--blue); outline-offset: 4px; }

        .rails { position: fixed; top: 0; bottom: 0; width: 22px; pointer-events: none; display: flex; gap: 8px; justify-content: center; }
        .rails.left { left: 6px; }
        .rails.right { right: 6px; }
        .rails i { width: 2px; height: 100%; }
        .rails i:first-child { background: var(--red); }
        .rails i:last-child { background: var(--blue); }

        .stage { position: relative; width: 100%; max-width: 640px; }

        /* The loose jumper wire: hangs from the top edge, plugged into nothing */
        .loose { position: absolute; left: 50%; bottom: calc(100% + 30px); width: 140px; height: 400px; transform: translateX(-24px); transform-origin: 24px 0; overflow: visible; animation: sway 5s ease-in-out infinite; }
        .loose .core { fill: none; stroke: var(--red); stroke-width: 6; stroke-linecap: round; }
        .loose .shine { fill: none; stroke: rgba(255, 255, 255, 0.35); stroke-width: 1.5; stroke-linecap: round; }
        .loose .tip { fill: var(--pin); }
        @keyframes sway { 0%, 100% { transform: translateX(-24px) rotate(0.6deg); } 50% { transform: translateX(-24px) rotate(-0.6deg); } }

        .chip {
            position: relative; background: var(--chip); color: var(--chip-text); border-radius: 5px;
            padding: calc(var(--pitch) * 2) calc(var(--pitch) * 2.25) calc(var(--pitch) * 1.75);
            box-shadow: 0 1px 0 #000, 0 12px 22px -12px rgba(10, 12, 14, 0.55);
            animation: seat 0.9s 0.1s var(--ease-seat) backwards;
        }
        .chip::before, .chip::after {
            content: ""; position: absolute; left: 22px; right: 22px; height: 9px;
            background: repeating-linear-gradient(90deg, var(--pin) 0 9px, transparent 9px var(--pitch));
        }
        .chip::before { top: -9px; border-radius: 2px 2px 0 0; }
        .chip::after { bottom: -9px; border-radius: 0 0 2px 2px; }
        .notch { position: absolute; left: 14px; top: 14px; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #6b7077; }
        .print { font-family: var(--display); font-weight: 600; font-size: 12.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #8b9097; }
        h1 { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 7vw, 68px); line-height: 0.95; letter-spacing: -0.01em; color: var(--chip-text); }
        .chip p { margin-top: 18px; max-width: 44ch; font-size: 18px; color: var(--chip-muted); }
        .chip .part { position: absolute; right: 22px; bottom: 16px; }

        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: calc(var(--pitch) * 2); }
        .btn {
            display: inline-flex; align-items: center; gap: 10px;
            font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase;
            padding: 13px 20px; border-radius: 4px; text-decoration: none;
            transition: transform 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out), background-color 0.3s var(--ease-out), color 0.3s var(--ease-out);
        }
        .btn-primary { background: var(--yellow); color: var(--ink); box-shadow: 0 1px 0 #b98714, 0 8px 16px -10px rgba(10, 12, 14, 0.5); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 1px 0 #b98714, 0 14px 22px -12px rgba(10, 12, 14, 0.55); }
        .btn-plain { color: var(--ink); border: 2px solid var(--ink); }
        .btn-plain:hover { background: var(--ink); color: var(--board); }
        .btn:active { transform: translateY(1px); }
        .icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.3s var(--ease-out); }
        .btn-primary:hover .icon { transform: translateX(-3px); }

        @keyframes seat { from { opacity: 0; transform: translateY(-14px); } }

        @media (max-width: 720px) {
            .rails { display: none; }
            body { padding-left: 20px; padding-right: 20px; }
            .chip { padding: calc(var(--pitch) * 1.75) calc(var(--pitch) * 1.25) calc(var(--pitch) * 2); }
        }

        @media (prefers-reduced-motion: reduce) {
            .loose, .chip { animation: none; }
            .btn, .icon { transition: none; }
        }
    </style>
</head>
<body>
    <div class="rails left" aria-hidden="true"><i></i><i></i></div>
    <div class="rails right" aria-hidden="true"><i></i><i></i></div>

    <main class="stage">
        <svg class="loose" viewBox="0 0 140 400" aria-hidden="true">
            <path class="core" d="M96 -400 V300 Q96 330 66 330 H54 Q24 330 24 360 V372"/>
            <path class="shine" d="M94.8 -400 V300 Q94.8 328.8 66 328.8 H54 Q22.8 328.8 22.8 360 V372"/>
            <rect class="tip" x="20.5" y="372" width="7" height="14" rx="1"/>
        </svg>
        <div class="chip">
            <span class="notch" aria-hidden="true"></span>
            <h1>Nothing is plugged in here.</h1>
            <p>This page is not on the board. The link may be mistyped, or the page may have moved.</p>
            <span class="print part">Error 404</span>
        </div>
        <div class="actions">
            <a class="btn btn-primary" href="/"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Back to the board</a>
            <a class="btn btn-plain" href="/#projects">View projects</a>
        </div>
    </main>
</body>
</html>
